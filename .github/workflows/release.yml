name: Release

# Push a tag such as v0.2.0 to publish a release. The tag must match the
# version in Kotodama.lua and server/kotodama/__init__.py. A tag with a
# hyphen (v0.2.0-rc1) is published as a prerelease.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  tests:
    uses: ./.github/workflows/tests.yml

  release:
    needs: tests
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Build the zip
        run: scripts/build_release.sh "$GITHUB_REF_NAME" dist
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          flags=()
          case "$TAG" in *-*) flags+=(--prerelease) ;; esac
          gh release create "$TAG" "dist/Kotodama-$TAG.zip" "dist/Kotodama-$TAG.zip.sha256" \
            --verify-tag --title "Kotodama $TAG" --generate-notes "${flags[@]}"
